name: Build iOS & Submit to TestFlight

on:
  push:
    branches:
      - sami-elite/3.0.0
      - sami-elite/3.0.1-demo
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: false

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the live SAMI backend the app talks to
        run: |
          set -u
          BASE=https://sami-elite.vercel.app
          ORIGIN="Origin: capacitor://localhost"
          echo "--- health"
          code=$(curl -s -o health.json -w '%{http_code}' -H "$ORIGIN" "$BASE/api/health"); echo "HTTP $code"; head -c 600 health.json; echo
          echo "--- what3words (convert-to-3wa, central London)"
          curl -s -w '\nHTTP %{http_code}\n' -H "$ORIGIN" -H 'Content-Type: application/json' \
            -d '{"coordinates":[-0.1276,51.5072]}' "$BASE/api/words" | head -c 600; echo
          echo "--- what3words (convert-to-coordinates)"
          curl -s -w '\nHTTP %{http_code}\n' -H "$ORIGIN" -H 'Content-Type: application/json' \
            -d '{"query":"///filled.count.soap"}' "$BASE/api/search" | head -c 600; echo
          echo "--- OSM street tile with no referer (as the iOS app requests it)"
          curl -s -o /dev/null -w 'HTTP %{http_code}\n' -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148' https://tile.openstreetmap.org/16/32745/21789.png
          if [ "$code" != "200" ] || ! grep -q '"version"' health.json; then
            echo "::error::The SAMI backend at $BASE is not reachable from outside (HTTP $code). The app's connected features will fail."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Sync iOS assets
        run: npm run ios:sync

      - name: Build iOS Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SAMI_BUILD_NUMBER: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          # Write ASC API key to file
          if [ -n "$ASC_KEY" ]; then
            mkdir -p ~/.appstoreconnect/keys
            echo "$ASC_KEY" > ~/.appstoreconnect/keys/AuthKey_${ASC_KEY_ID}.p8
            export ASC_KEY_PATH=~/.appstoreconnect/keys/AuthKey_${ASC_KEY_ID}.p8
          fi
          bash scripts/archive-ios.sh

      - name: Submit to TestFlight
        if: github.ref == 'refs/heads/sami-elite/3.0.0' || inputs.upload == true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_FILE=$(find build/export -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No .ipa file found!"
            exit 1
          fi
          echo "Found IPA: $IPA_FILE"
          echo "Submitting to App Store Connect..."

          # Use xcrun to submit via App Store Connect
          xcrun altool --upload-app \
            --file "$IPA_FILE" \
            --type ios \
            --username "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --show-progress

          echo "✅ Binary submitted to TestFlight!"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sami-elite-ipa
          path: build/export/*.ipa
          retention-days: 30
