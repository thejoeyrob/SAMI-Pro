name: Build iOS & Submit to TestFlight

on:
  push:
    branches:
      - sami-elite/3.0.0
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Sync iOS assets
        run: npm run ios:sync

      - name: Build iOS Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SAMI_BUILD_NUMBER: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          # Write ASC API key to file
          if [ -n "$ASC_KEY" ]; then
            mkdir -p ~/.appstoreconnect/keys
            echo "$ASC_KEY" > ~/.appstoreconnect/keys/AuthKey_${ASC_KEY_ID}.p8
            export ASC_KEY_PATH=~/.appstoreconnect/keys/AuthKey_${ASC_KEY_ID}.p8
          fi
          bash scripts/archive-ios.sh

      - name: Submit to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_FILE=$(find build/export -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No .ipa file found!"
            exit 1
          fi
          echo "Found IPA: $IPA_FILE"
          echo "Submitting to App Store Connect..."

          # Use xcrun to submit via App Store Connect
          xcrun altool --upload-app \
            --file "$IPA_FILE" \
            --type ios \
            --username "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --show-progress

          echo "✅ Binary submitted to TestFlight!"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sami-elite-ipa
          path: build/export/*.ipa
          retention-days: 30
