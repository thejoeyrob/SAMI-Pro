<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="SAMI - Spatial Analysis Mapping Intelligence. Site planning with services, constraints, and infrastructure data." />
    <meta name="theme-color" content="#0a0e12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SAMI" />

    <title>SAMI - Spatial Analysis Mapping Intelligence</title>

    <!-- Leaflet for mapping -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />

    <!-- Styles -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-dark: #0a0e12;
        --bg-card: #141a21;
        --text-primary: #ffffff;
        --text-secondary: #a8b0b8;
        --accent-blue: #0ea5e9;
        --accent-yellow: #fbbf24;
        --accent-red: #ef4444;
        --success: #10b981;
        --border: #233244;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      }

      html, body {
        height: 100%;
        background: var(--bg-dark);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg-dark);
      }

      /* HEADER */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border);
        min-height: 56px;
        gap: 12px;
      }

      .header-logo {
        font-weight: bold;
        font-size: 18px;
        color: var(--text-primary);
        letter-spacing: 2px;
      }

      .header-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .project-name {
        font-weight: 600;
        font-size: 15px;
        color: var(--text-primary);
        background: transparent;
        border: none;
        padding: 2px 4px;
        cursor: text;
      }

      .project-name:focus {
        outline: 1px solid var(--accent-blue);
        border-radius: 2px;
      }

      .save-status {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .save-status.saving {
        color: var(--accent-yellow);
      }

      .save-status.saved {
        color: var(--success);
      }

      .header-menu {
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        padding: 8px;
        font-size: 20px;
        display: flex;
        align-items: center;
      }

      .header-menu:hover {
        opacity: 0.8;
      }

      /* TOOLBAR */
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        background: var(--bg-card);
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
        order: 10;
      }

      .tool-btn {
        padding: 8px 16px;
        border: 1px solid var(--border);
        background: var(--bg-dark);
        color: var(--text-primary);
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s;
        touch-action: manipulation;
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tool-btn:hover {
        border-color: var(--accent-blue);
        background: rgba(14, 165, 233, 0.1);
      }

      .tool-btn.active {
        background: var(--accent-blue);
        border-color: var(--accent-blue);
        color: white;
      }

      .tool-btn.boundary {
        border-color: var(--accent-yellow);
      }

      .tool-btn.boundary:hover {
        background: rgba(251, 191, 36, 0.1);
      }

      .tool-btn.boundary.active {
        background: var(--accent-yellow);
        color: var(--bg-dark);
      }

      .tool-btn.clear {
        border-color: var(--accent-red);
      }

      .tool-btn.clear:hover {
        background: rgba(239, 68, 68, 0.1);
      }

      .tool-btn.clear:active {
        background: var(--accent-red);
        color: white;
      }

      /* MAP */
      #map {
        flex: 1;
        position: relative;
        background: var(--bg-dark);
      }

      .leaflet-container {
        background: var(--bg-dark);
      }

      /* INSTRUCTION TEXT */
      .instruction-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(14, 20, 30, 0.9);
        color: var(--text-primary);
        padding: 16px 24px;
        border-radius: 8px;
        border: 1px solid var(--border);
        pointer-events: none;
        font-size: 15px;
        font-weight: 500;
        text-align: center;
        z-index: 100;
        display: none;
      }

      .instruction-overlay.show {
        display: block;
      }

      /* SIDE PANEL */
      .services-panel {
        position: fixed;
        right: -400px;
        top: 0;
        width: 400px;
        height: 100vh;
        background: var(--bg-card);
        border-left: 1px solid var(--border);
        z-index: 500;
        transition: right 0.3s;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow);
      }

      .services-panel.open {
        right: 0;
      }

      .panel-header {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .panel-title {
        font-weight: 600;
        font-size: 15px;
      }

      .panel-close {
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        font-size: 20px;
        padding: 4px 8px;
      }

      .panel-content {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
      }

      .service-section {
        margin-bottom: 20px;
      }

      .section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      .service-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .service-item:hover {
        background: rgba(14, 165, 233, 0.15);
        border-color: var(--accent-blue);
      }

      .service-item-name {
        font-weight: 500;
        font-size: 14px;
      }

      .service-item-type {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
      }

      .search-box {
        width: 100%;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-primary);
        font-size: 14px;
        margin-bottom: 12px;
      }

      .search-box::placeholder {
        color: var(--text-secondary);
      }

      /* MODAL */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: flex-end;
        z-index: 600;
        padding: 0;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        background: var(--bg-card);
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        border-radius: 12px 12px 0 0;
        padding: 20px;
        border: 1px solid var(--border);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .modal-title {
        font-weight: 600;
        font-size: 18px;
      }

      .modal-close {
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        font-size: 24px;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }

      .detail-label {
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
      }

      .detail-value {
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 500;
      }

      .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .btn-primary {
        flex: 1;
        padding: 12px;
        background: var(--accent-blue);
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        transition: opacity 0.2s;
      }

      .btn-primary:hover {
        opacity: 0.9;
      }

      .btn-secondary {
        flex: 1;
        padding: 12px;
        background: transparent;
        color: var(--accent-blue);
        border: 1px solid var(--accent-blue);
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }

      /* TOAST MESSAGE */
      .toast {
        position: fixed;
        bottom: 100px;
        left: 16px;
        right: 16px;
        background: rgba(16, 185, 129, 0.9);
        color: white;
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 13px;
        display: none;
        z-index: 700;
        animation: slideUp 0.3s;
      }

      .toast.show {
        display: block;
      }

      .toast.error {
        background: rgba(239, 68, 68, 0.9);
      }

      @keyframes slideUp {
        from {
          transform: translateY(100px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .services-panel {
          width: 100%;
          right: -100%;
        }

        .modal-content {
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- HEADER -->
      <div class="header">
        <div class="header-logo">SAMI</div>
        <div class="header-center">
          <input type="text" class="project-name" id="projectName" value="New Project" />
          <div class="save-status" id="saveStatus">Saved</div>
        </div>
        <button class="header-menu" id="menuBtn" aria-label="Menu">⋮</button>
      </div>

      <!-- MAP -->
      <div id="map"></div>

      <!-- INSTRUCTION TEXT -->
      <div class="instruction-overlay" id="instruction"></div>

      <!-- TOOLBAR -->
      <div class="toolbar">
        <button class="tool-btn boundary" id="boundaryBtn" aria-label="Define boundary">📍 Boundary</button>
        <button class="tool-btn" id="lineBtn" aria-label="Draw line">📏 Line</button>
        <button class="tool-btn" id="polygonBtn" aria-label="Draw polygon">🔷 Polygon</button>
        <button class="tool-btn" id="circleBtn" aria-label="Draw circle">⭕ Circle</button>
        <button class="tool-btn clear" id="clearBtn" aria-label="Clear last feature">🗑️ Clear</button>
      </div>
    </div>

    <!-- SIDE PANEL -->
    <div class="services-panel" id="servicesPanel">
      <div class="panel-header">
        <div class="panel-title">Services & Constraints</div>
        <button class="panel-close" id="panelClose">✕</button>
      </div>
      <div class="panel-content">
        <input type="text" class="search-box" id="serviceSearch" placeholder="Search services..." />

        <div class="service-section">
          <div class="section-title">Nearby Utilities</div>
          <div id="utilitiesList"></div>
        </div>

        <div class="service-section">
          <div class="section-title">Constraints</div>
          <div id="constraintsList"></div>
        </div>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle"></div>
          <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>

    <!-- DATA LAYER -->
    <script>
      // ============================================================
      // EMBEDDED DATA - UK Infrastructure Databases
      // ============================================================

      window.SAMIData = {
        // Sample OHL lines (50+ in production)
        ohlLines: [
          { id: 'OHL-001', name: 'Thames Valley Main', voltage: '132kV', operator: 'UK Power Networks', length: 85.4, towers: 142, coords: [[51.2, -0.5], [51.3, -0.4]] },
          { id: 'OHL-002', name: 'Kent Coast Feeder', voltage: '66kV', operator: 'UK Power Networks', length: 54.2, towers: 108, coords: [[51.1, 0.5], [51.2, 0.6]] },
          { id: 'OHL-003', name: 'Sussex Distribution', voltage: '33kV', operator: 'UK Power Networks', length: 42.8, towers: 94, coords: [[51.0, -0.2], [51.1, -0.1]] },
        ],

        // Gas pipelines
        gasPipelines: [
          { id: 'GAS-001', name: 'Thames Valley Main Trunk', pressure: '70 bar', operator: 'Cadent', length: 142.5, coords: [[51.2, -0.5], [52.5, -2.0]] },
          { id: 'GAS-002', name: 'East Coast Trunk', pressure: '56 bar', operator: 'Cadent', length: 98.3, coords: [[51.9, 0.5], [52.6, 1.3]] },
        ],

        // Constraints
        constraints: [
          { id: 'FZ-001', type: 'Flood Zone', subtype: 'Zone 2', name: 'South East Flood Zone 2', coords: [[51.0, -0.3], [51.2, -0.1]] },
          { id: 'FZ-002', type: 'Flood Zone', subtype: 'Zone 3a', name: 'Thames Flood Zone 3a', coords: [[51.3, -0.2], [51.5, -0.0]] },
          { id: 'HER-001', type: 'Heritage', subtype: 'Grade 1', name: 'Historic Building A', coords: [[51.1, -0.1]] },
          { id: 'SSSI-001', type: 'SSSI', subtype: 'Protected Area', name: 'Protected Nature Reserve', coords: [[51.0, 0.0], [51.2, 0.2]] },
        ]
      };

      // ============================================================
      // STATE MANAGEMENT
      // ============================================================

      window.SAMIState = {
        mode: null,              // null, 'boundary', 'line', 'polygon', 'circle'
        isDrawing: false,
        currentFeatures: [],
        boundary: null,
        currentPoints: [],
        lastSaved: Date.now(),

        setMode(newMode) {
          this.mode = newMode;
          this.isDrawing = newMode !== null;
        },

        addPoint(lat, lng) {
          this.currentPoints.push([lat, lng]);
        },

        clearPoints() {
          this.currentPoints = [];
        },

        addFeature(feature) {
          this.currentFeatures.push(feature);
          this.lastSaved = Date.now();
        },

        clear() {
          if (this.currentFeatures.length > 0) {
            this.currentFeatures.pop();
          }
        }
      };

      // ============================================================
      // UI INITIALIZATION
      // ============================================================

      let map = null;

      function initMap() {
        map = L.map('map').setView([51.5, -0.09], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap',
          maxZoom: 19,
          className: 'leaflet-tile'
        }).addTo(map);

        // Add OHL lines to map
        SAMIData.ohlLines.forEach(line => {
          L.polyline(line.coords, { color: 'orange', weight: 2 }).addTo(map)
            .bindPopup(`<strong>${line.name}</strong><br>${line.voltage}<br>${line.operator}`);
        });

        // Add gas pipelines
        SAMIData.gasPipelines.forEach(pipe => {
          L.polyline(pipe.coords, { color: 'brown', weight: 2 }).addTo(map)
            .bindPopup(`<strong>${pipe.name}</strong><br>${pipe.pressure}<br>${pipe.operator}`);
        });
      }

      // ============================================================
      // EVENT HANDLERS
      // ============================================================

      function setupEventListeners() {
        // Tool buttons
        document.getElementById('boundaryBtn').addEventListener('click', () => {
          toggleTool('boundary', 'Tap 4 corners to define site boundary');
        });

        document.getElementById('lineBtn').addEventListener('click', () => {
          toggleTool('line', 'Tap to place points, then click Finish');
        });

        document.getElementById('polygonBtn').addEventListener('click', () => {
          toggleTool('polygon', 'Tap to place points, closes automatically');
        });

        document.getElementById('circleBtn').addEventListener('click', () => {
          toggleTool('circle', 'Tap center, then tap edge point');
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
          SAMIState.clear();
          map.eachLayer(layer => {
            if (layer instanceof L.Polyline || layer instanceof L.Polygon) {
              map.removeLayer(layer);
            }
          });
          showToast('Last feature removed');
        });

        // Menu
        document.getElementById('menuBtn').addEventListener('click', () => {
          document.getElementById('servicesPanel').classList.toggle('open');
        });

        document.getElementById('panelClose').addEventListener('click', () => {
          document.getElementById('servicesPanel').classList.remove('open');
        });

        // Modal
        document.getElementById('modalClose').addEventListener('click', () => {
          document.getElementById('modal').classList.remove('show');
        });

        // Map clicks
        map.on('click', handleMapClick);

        // Load services list
        loadServicesList();
      }

      function toggleTool(tool, instruction) {
        const btn = document.getElementById(tool + 'Btn');
        const isActive = btn.classList.contains('active');

        // Remove active state from all buttons
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));

        if (!isActive) {
          btn.classList.add('active');
          SAMIState.setMode(tool);
          SAMIState.clearPoints();
          showInstruction(instruction);
        } else {
          SAMIState.setMode(null);
          hideInstruction();
        }
      }

      function handleMapClick(e) {
        if (!SAMIState.isDrawing) return;

        const { lat, lng } = e.latlng;
        SAMIState.addPoint(lat, lng);

        // Visual feedback
        L.circleMarker([lat, lng], { radius: 5, color: 'blue', fill: true }).addTo(map);

        // Check if drawing should auto-complete
        if (SAMIState.mode === 'boundary' && SAMIState.currentPoints.length === 4) {
          finishBoundary();
        }
      }

      function finishBoundary() {
        if (SAMIState.currentPoints.length < 3) {
          showToast('Need at least 3 points', 'error');
          return;
        }

        const polygon = L.polygon(SAMIState.currentPoints, { color: '#fbbf24', fillOpacity: 0.2 }).addTo(map);
        SAMIState.boundary = polygon;
        SAMIState.addFeature(polygon);

        toggleTool('boundary', '');
        showToast('Boundary defined!');
      }

      function loadServicesList() {
        const utilitiesList = document.getElementById('utilitiesList');
        const constraintsList = document.getElementById('constraintsList');

        // Add OHL lines
        SAMIData.ohlLines.slice(0, 3).forEach(line => {
          const item = document.createElement('div');
          item.className = 'service-item';
          item.innerHTML = `<div class="service-item-name">${line.name}</div><div class="service-item-type">${line.voltage} - ${line.operator}</div>`;
          item.addEventListener('click', () => showServiceDetail(line));
          utilitiesList.appendChild(item);
        });

        // Add constraints
        SAMIData.constraints.slice(0, 3).forEach(constraint => {
          const item = document.createElement('div');
          item.className = 'service-item';
          item.innerHTML = `<div class="service-item-name">${constraint.name}</div><div class="service-item-type">${constraint.type}</div>`;
          item.addEventListener('click', () => showConstraintDetail(constraint));
          constraintsList.appendChild(item);
        });
      }

      function showServiceDetail(service) {
        const modal = document.getElementById('modal');
        document.getElementById('modalTitle').textContent = service.name;
        document.getElementById('modalBody').innerHTML = `
          <div class="detail-row">
            <span class="detail-label">Type</span>
            <span class="detail-value">Overhead Line</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Voltage</span>
            <span class="detail-value">${service.voltage}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Operator</span>
            <span class="detail-value">${service.operator}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Length</span>
            <span class="detail-value">${service.length} km</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Towers</span>
            <span class="detail-value">${service.towers}</span>
          </div>
        `;
        document.getElementById('modalActions').innerHTML = `
          <button class="btn-primary">Add to Map</button>
          <button class="btn-secondary" onclick="document.getElementById('modal').classList.remove('show')">Close</button>
        `;
        modal.classList.add('show');
      }

      function showConstraintDetail(constraint) {
        const modal = document.getElementById('modal');
        document.getElementById('modalTitle').textContent = constraint.name;
        document.getElementById('modalBody').innerHTML = `
          <div class="detail-row">
            <span class="detail-label">Type</span>
            <span class="detail-value">${constraint.type}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Subtype</span>
            <span class="detail-value">${constraint.subtype}</span>
          </div>
        `;
        document.getElementById('modalActions').innerHTML = `
          <button class="btn-secondary" onclick="document.getElementById('modal').classList.remove('show')">Close</button>
        `;
        modal.classList.add('show');
      }

      function showInstruction(text) {
        const instruction = document.getElementById('instruction');
        instruction.textContent = text;
        instruction.classList.add('show');
      }

      function hideInstruction() {
        document.getElementById('instruction').classList.remove('show');
      }

      function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        if (type === 'error') toast.classList.add('error');

        setTimeout(() => {
          toast.classList.remove('show', 'error');
        }, 3000);
      }

      // ============================================================
      // STARTUP
      // ============================================================

      document.addEventListener('DOMContentLoaded', () => {
        initMap();
        setupEventListeners();
        showToast('Welcome to SAMI! Start by defining a boundary.');
      });
    </script>
  </body>
</html>
